<script type="text/typescript" id="ts-app">
/* ================= 外部全域宣告（CDN 庫） ================= */
declare const d3: any;
declare const renderMathInElement: any;
declare const html2pdf: any;

/* ================= 業務數據型別（對應兩個 JSON 檔案結構） ================= */
interface Concept {
  conceptId: string; title: string; titleEn: string;
  explanation: string; explanationEn: string;
  relatedFormulaIds: string[]; relatedQuestionIds: string[];
  tags: string[]; tagsEn: string[];
}
interface Formula {
  formulaId: string; name: string; nameEn: string;
  latex: string; description: string; descriptionEn: string;
  relatedConceptIds: string[];
}
interface Chapter {
  chapterId: string; chapterName: string; chapterNameEn: string;
  summary: string; summaryEn: string;
  concepts: Concept[]; formulas: Formula[];
}
interface KB { chapters: Chapter[]; }
interface Question {
  questionId: string; chapterId: string;
  questionText: string; questionTextEn: string;
  options: Record<string, string>; optionsEn: Record<string, string>;
  correctAnswer: string;
  explanation: string; explanationEn: string;
  relatedConceptIds: string[]; relatedFormulaIds: string[];
  difficulty: 'easy' | 'medium' | 'hard';
  tags: string[]; tagsEn: string[];
}
interface QB { questions: Question[]; }

/* ================= 個人數據型別（LocalStorage） ================= */
type Mastery = 'mastered' | 'review' | 'unmastered';          // 掌握狀態
type FCRating = 'remember' | 'fuzzy' | 'forgot';              // 閃卡評分
type Lang = 'zh' | 'en';

interface FCHistoryItem { last: number; lastRating: FCRating; remember: number; fuzzy: number; forgot: number; total: number; }
interface WrongItem { t: number; n: number; }
interface QLogItem { c: number; w: number; t: number; }        // 做題記錄：正確/錯誤次數

/* ================= LocalStorage 鍵值（個人數據與快取，獨立於 JSON） ================= */
const K = {
  lang: 'frm2_v1_lang',            // 介面語言
  theme: 'frm2_v1_theme',          // 深淺色主題
  mastery: 'frm2_v1_master',       // 知識點/公式掌握標記 { id: Mastery }
  flash: 'frm2_v1_fc',             // 閃卡複習歷史 { id: FCHistoryItem }
  wrong: 'frm2_v1_wrong',          // 錯題本 { qid: WrongItem }
  qlog: 'frm2_v1_qlog',            // 做題記錄 { qid: QLogItem }
  kb: 'frm2_v1_kb_cache',          // knowledge_base.json 快取
  qb: 'frm2_v1_qb_cache',          // question_bank.json 快取
};

/* ================= 基礎工具 ================= */
function lsGet<T>(key: string, def: T): T {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) as T : def; }
  catch { return def; }
}
function lsSet(key: string, val: any): void {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { toast('LocalStorage 寫入失敗（空間可能不足）', 'error'); }
}
function esc(s: any): string {   // HTML 轉義，防止內容破壞排版
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function now(): number { return Date.now(); }
function fmtTime(sec: number): string {
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function shuffle<T>(arr: T[]): T[] {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ================= 提示訊息 Toast ================= */
function toast(msg: string, kind: 'ok'|'error'|'info' = 'ok'): void {
  const root = document.getElementById('toast-root')!;
  const color = kind === 'ok' ? 'bg-emerald-600' : kind === 'error' ? 'bg-rose-600' : 'bg-sky-600';
  const el = document.createElement('div');
  el.className = `${color} text-white text-sm px-4 py-2.5 rounded-lg shadow-lg max-w-xs break-words`;
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; setTimeout(() => el.remove(), 400); }, 2600);
}

/* ================= 全域狀態 ================= */
let LANG: Lang = lsGet<Lang>(K.lang, 'zh');
let THEME: 'light' | 'dark' = lsGet<'light'|'dark'>(K.theme, 'light');
let KB: KB | null = null;            // 知識庫數據
let QB: QB | null = null;            // 題庫數據
let READY = false;                   // 數據是否就緒

// 索引 Map（數據載入後重建）
let CH: Map<string, Chapter> = new Map();
let CP: Map<string, Concept> = new Map();
let FM: Map<string, Formula> = new Map();
let QS: Map<string, Question> = new Map();

function rebuildIndex(): void {
  CH = new Map(); CP = new Map(); FM = new Map(); QS = new Map();
  (KB?.chapters || []).forEach(c => {
    CH.set(c.chapterId, c);
    (c.concepts || []).forEach(x => CP.set(x.conceptId, x));
    (c.formulas || []).forEach(x => FM.set(x.formulaId, x));
  });
  (QB?.questions || []).forEach(q => QS.set(q.questionId, q));
}

/* ================= 個人數據存取層（LocalStorage） ================= */
const MasteryStore = {
  all(): Record<string, Mastery> { return lsGet(K.mastery, {}); },
  get(id: string): Mastery { return this.all()[id] || 'unmastered'; },
  set(id: string, m: Mastery): void { const a = this.all(); a[id] = m; lsSet(K.mastery, a); },
};
const FlashStore = {
  all(): Record<string, FCHistoryItem> { return lsGet(K.flash, {}); },
  rate(id: string, r: FCRating): void {
    const a = this.all();
    const it: FCHistoryItem = a[id] || { last: 0, lastRating: r, remember: 0, fuzzy: 0, forgot: 0, total: 0 };
    it.last = now(); it.lastRating = r; it.total++;
    if (r === 'remember') it.remember++; else if (r === 'fuzzy') it.fuzzy++; else it.forgot++;
    a[id] = it; lsSet(K.flash, a);
  },
};
const WrongStore = {
  all(): Record<string, WrongItem> { return lsGet(K.wrong, {}); },
  add(qid: string): void {
    const a = this.all();
    a[qid] = { t: now(), n: (a[qid]?.n || 0) + 1 }; lsSet(K.wrong, a);
  },
  remove(qid: string): void { const a = this.all(); delete a[qid]; lsSet(K.wrong, a); },
  has(qid: string): boolean { return !!this.all()[qid]; },
  count(): number { return Object.keys(this.all()).length; },
};
const QLogStore = {
  all(): Record<string, QLogItem> { return lsGet(K.qlog, {}); },
  record(qid: string, correct: boolean): void {
    const a = this.all();
    const it: QLogItem = a[qid] || { c: 0, w: 0, t: 0 };
    if (correct) it.c++; else it.w++;
    it.t = now(); a[qid] = it; lsSet(K.qlog, a);
  },
  totalDone(): number { return Object.values(this.all()).reduce((s, x) => s + x.c + x.w, 0); },
  totalCorrect(): number { return Object.values(this.all()).reduce((s, x) => s + x.c, 0); },
};

/** 依當前語言選擇內容欄位 */
function L<T>(zh: T, en: T): T { return LANG === 'zh' ? zh : en; }

const qOpt = (q: Question, k: string) => L(q.options?.[k] || '', q.optionsEn?.[k] || '');
const qExpl = (q: Question) => L(q.explanation, q.explanationEn);
const qTags = (q: Question) => L(q.tags, q.tagsEn);

/* ================= LaTeX 渲染（容錯處理） ================= */
function renderMath(container: HTMLElement | null): void {
  if (!container) return;
  if (typeof renderMathInElement !== 'function') return;   // CDN 未載入時靜默跳過
  try {
    renderMathInElement(container, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
      ],
      throwOnError: false,
      errorColor: '#dc2626',
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
    });
  } catch (e) { console.warn('KaTeX render error', e); }
}

const CDN_SRC = {
  d3: 'https://cdn.jsdelivr.net/npm/d3@7',
  html2pdf: 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js',
};
const D3_SRC = CDN_SRC.d3;
const _loaded: Record<string, Promise<void>> = {};
function loadScript(src: string): Promise<void> {
  if (!_loaded[src]) {
    _loaded[src] = new Promise<void>((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => { delete _loaded[src]; reject(new Error('script load failed: ' + src)); };
      (document.head || document.getElementsByTagName('head')[0]).appendChild(s);
    });
  }
  return _loaded[src];
}

/* ================= 視圖路由 ================= */
type ViewKey = 'kb' | 'fm' | 'fc' | 'graph' | 'quiz' | 'wrong' | 'stats';
const NAV: { key: ViewKey; icon: string }[] = [
  { key: 'kb', icon: '📚' }, { key: 'fm', icon: '🧮' }, { key: 'fc', icon: '🃏' },
  { key: 'graph', icon: '🕸️' }, { key: 'quiz', icon: '📝' }, { key: 'wrong', icon: '⭐' },
  { key: 'stats', icon: '📊' },
];
let ACTIVE: ViewKey = 'kb';

function currentHash(): ViewKey {
  const h = location.hash.replace(/^#\//, '');
  const k = h.split('?')[0] as ViewKey;
  return NAV.some(n => n.key === k) ? k : 'kb';
}

function navigate(v: ViewKey): void {
  location.hash = '#/' + v;
}

window.addEventListener('hashchange', () => { ACTIVE = currentHash(); renderApp(); });

/* ================= 彈窗（支持堆疊：概念→題目→公式…） ================= */
let modalStack: { type: 'concept'|'formula'|'question'|'help'; id: string }[] = [];

function openModal(type: 'concept'|'formula'|'question'|'help', id: string): void {
  modalStack.push({ type, id });
  renderModal();
}
function closeModal(): void { modalStack.pop(); renderModal(); refreshGraphColors(); }
function closeAllModals(): void { modalStack = []; renderModal(); refreshGraphColors(); }
/** 彈窗關閉後，若當前在圖譜視圖則重繪以同步掌握狀態顏色 */
function refreshGraphColors(): void { if (ACTIVE === 'graph' && READY) { try { buildGraph(); } catch {} } }

function renderModal(): void {
  const root = document.getElementById('modal-root')!;
  if (!modalStack.length) { root.innerHTML = ''; return; }
  const top = modalStack[modalStack.length - 1];
  let inner = '';
  if (top.type === 'help') inner = helpModalHTML();
  else if (top.type === 'concept') inner = conceptDetailHTML(top.id);
  else if (top.type === 'formula') inner = formulaDetailHTML(top.id);
  else if (top.type === 'question') inner = questionDetailHTML(top.id);
  if (!inner) { modalStack.pop(); if (modalStack.length) { renderModal(); } else { root.innerHTML = ''; } return; }
  root.innerHTML = `
  <div class="fixed inset-0 z-[70] flex items-start justify-center p-3 sm:p-8 overflow-y-auto bg-slate-900/60 backdrop-blur-sm" data-act="modal-backdrop">
    <div class="w-full max-w-3xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl my-4">
      <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200 dark:border-slate-700 sticky top-0 bg-white dark:bg-slate-900 rounded-t-2xl z-10">
        <div class="text-xs text-slate-500 hidden sm:block">${t('back')} / ${t('close')}：ESC</div>
        <div class="flex items-center gap-2">
          ${modalStack.length > 1 ? `<button class="px-3 py-1.5 text-sm rounded-lg bg-slate-200 dark:bg-slate-700 hover:opacity-80" data-act="modal-back">← ${t('back')}</button>` : ''}
          <button class="px-3 py-1.5 text-sm rounded-lg bg-slate-200 dark:bg-slate-700 hover:opacity-80" data-act="modal-close">✕</button>
        </div>
      </div>
      <div class="px-5 py-4">${inner}</div>
    </div>
  </div>`;
  renderMath(root);
}
document.addEventListener('keydown', (e: KeyboardEvent) => { if (e.key === 'Escape' && modalStack.length) closeModal(); });

/* ================= 視圖1：章節知識點瀏覽（含關鍵字搜尋引擎） ================= */
const KBState = { ch: 'all', sub: 'concept' as 'concept'|'formula', status: 'all' as 'all'|Mastery, kw: '' };

interface KBSearchHit { type: 'concept'|'formula'|'question'; id: string; chId: string; title: string; snippet: string; }

/** 關鍵字搜尋引擎：跨概念/公式/題目，中英文欄位同時比對；多關鍵字（空格分隔）為 AND 邏輯 */
function kbSearch(kw: string): { concepts: KBSearchHit[]; formulas: KBSearchHit[]; questions: KBSearchHit[] } {
  const tokens = kw.toLowerCase().split(/\s+/).filter(Boolean);
  const out = { concepts: [] as KBSearchHit[], formulas: [] as KBSearchHit[], questions: [] as KBSearchHit[] };
  if (!tokens.length) return out;
  const inText = (hay: string): boolean => {
    const t = hay.toLowerCase();
    return tokens.every(tok => t.indexOf(tok) >= 0);
  };
  // 章節範圍：選了特定章節則在該章內搜尋，否則全庫搜尋
  const chOk = (chId: string): boolean => KBState.ch === 'all' || KBState.ch === chId;
  // 生成摘要：定位第一個命中位置，前後取文
  const snippet = (text: string): string => {
    const lower = text.toLowerCase();
    let idx = -1, hitLen = 0;
    tokens.forEach(tok => {
      const i = lower.indexOf(tok);
      if (i >= 0 && (idx < 0 || i < idx)) { idx = i; hitLen = tok.length; }
    });
    if (idx < 0) idx = 0;
    const start = Math.max(0, idx - 40);
    const end = Math.min(text.length, idx + hitLen + 110);
    return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
  };
  KB!.chapters.forEach(c => {
    (c.concepts || []).forEach(x => {
      if (!chOk(c.chapterId)) return;
      const hay = [x.conceptId, x.title, x.titleEn, x.explanation, x.explanationEn, (x.tags || []).join(' '), (x.tagsEn || []).join(' ')].join('\n');
      if (inText(hay)) out.concepts.push({ type: 'concept', id: x.conceptId, chId: c.chapterId, title: cTitle(x), snippet: snippet(x.explanation || x.title) });
    });
    (c.formulas || []).forEach(x => {
      if (!chOk(c.chapterId)) return;
      const hay = [x.formulaId, x.name, x.nameEn, x.latex, x.description, x.descriptionEn].join('\n');
      if (inText(hay)) out.formulas.push({ type: 'formula', id: x.formulaId, chId: c.chapterId, title: fName(x), snippet: snippet(x.description || x.name) });
    });
  });
  QB!.questions.forEach(q => {
    if (!chOk(q.chapterId)) return;
    const hay = [q.questionId, q.questionText, q.questionTextEn, (q.tags || []).join(' ')].join('\n');
    if (inText(hay)) out.questions.push({ type: 'question', id: q.questionId, chId: q.chapterId, title: qText(q), snippet: snippet(qText(q)) });
  });
  return out;
}

/** 在已 HTML 轉義的文本上高亮關鍵字（mark 標記） */
function hlMark(text: string, kw: string): string {
  const escd = esc(text);
  const tokens = kw.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!tokens.length) return escd;
  let outText = escd;
  tokens.forEach(tok => {
    // 轉義正則特殊字符，避免關鍵字含符號時崩潰
    const safe = tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    outText = outText.replace(new RegExp(safe, 'gi'), m => '<mark class="bg-amber-200 dark:bg-amber-600/50 rounded px-0.5">' + m + '</mark>');
  });
  return outText;
}

/** 搜尋結果卡片（點擊打開對應詳情彈窗） */
function searchHitHTML(h: KBSearchHit, kw: string): string {
  const cls = h.type === 'concept' ? 'bg-sky-100 dark:bg-sky-900 text-sky-700 dark:text-sky-300'

  return `

/* ================= 視圖3：Anki 閃卡 ================= */
interface FCDeck { items: { id: string; type: 'concept'|'formula' }[]; }
const FCState = { ch: 'all', scope: 'weak' as 'all'|'weak', type: 'all' as 'all'|'concept'|'formula',
  deck: [] as { id: string; type: 'concept'|'formula' }[], flipped: false, session: { remember: 0, fuzzy: 0, forgot: 0 },
  cur: null as string | null };

function fcAllCards(): { id: string; type: 'concept'|'formula' }[] {
  const out: { id: string; type: 'concept'|'formula' }[] = [];
  KB!.chapters.forEach(c => {
    if (FCState.ch !== 'all' && c.chapterId !== FCState.ch) return;
    c.concepts.forEach(x => out.push({ id: x.conceptId, type: 'concept' }));
    c.formulas.forEach(x => out.push({ id: x.formulaId, type: 'formula' }));
  });
  return out;
}
/** 簡易Anki優先抽卡：忘記 > 未掌握 > 待複習 > 已掌握，另疊加歷史評分與隨機性 */
function fcWeight(card: { id: string; type: 'concept' | 'formula' }): number {
  const m = MasteryStore.get(card.id);
  const h = FlashStore.all()[card.id];
  let w = m === 'unmastered' ? 40 : m === 'review' ? 25 : 8;
  if (h) {
    if (h.lastRating === 'forgot') w += 30;
    else if (h.lastRating === 'fuzzy') w += 15;
    else w -= 5;                                   // 記住 → 降低權重
    w += Math.min(h.forgot * 4, 12);               // 歷史忘記次數加權
  }
  if (FCState.scope === 'weak' && m === 'mastered' && (!h || h.lastRating !== 'forgot')) w = 1;  // 薄弱模式下幾乎不抽已掌握
  return Math.max(w, 0.5) * (0.85 + Math.random() * 0.3);
}
function fcBuildDeck(): void {
  let cards = fcAllCards();
  if (FCState.type !== 'all') cards = cards.filter(x => x.type === FCState.type);
  // 「僅未掌握+待複習」篩選：排除已掌握項（除非最近一次自評為忘記）
  if (FCState.scope === 'weak') cards = cards.filter(x => MasteryStore.get(x.id) !== 'mastered' || FlashStore.all()[x.id]?.lastRating === 'forgot');
  FCState.deck = cards;
  FCState.flipped = false;
  FCState.session = { remember: 0, fuzzy: 0, forgot: 0 };
  fcStateExt.lastId = null;
  FCState.cur = fcNextId();
}
/** 加權隨機抽出一張卡（避開上一張），Anki式優先複習薄弱點 */
function fcNextId(): string | null {
  const pool = FCState.deck.filter(x => x.id !== fcStateExt.lastId);
  const use = pool.length ? pool : FCState.deck;
  if (!use.length) return null;
  const weights = use.map(x => fcWeight(x));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < use.length; i++) { r -= weights[i]; if (r <= 0) return use[i].id; }
  return use[use.length - 1].id;
}
// 記錄上一張卡，避免連續重複
const fcStateExt = { lastId: null as string | null };

function fcCardFront(id: string): string {
  const isC = id.startsWith('C') && CP.has(id);
  const c = CP.get(id), f = FM.get(id);
  const title = isC ? cTitle(c!) : fName(f!);
  const typeLabel = isC ? t('concept') : t('formula');
  const ch = KB!.chapters.find(x => isC ? x.concepts.includes(c!) : x.formulas.includes(f!));
  const m = MasteryStore.get(id);
  return `
  <div class="text-center">
    <div class="text-xs text-slate-400 mb-3">${isC ? '📚' : '🧮'} ${typeLabel} · ${ch ? esc(chName(ch)) : ''} · <span class="font-mono">${esc(id)}</span></div>
    <div class="text-2xl font-bold my-8 px-4">${esc(title)}</div>
    <div class="fc-hint text-sm text-slate-400 mt-10">${t('fc_flip')}</div>
  </div>`;
}
function fcCardBack(id: string): string {
  const isC = id.startsWith('C') && CP.has(id);
  const c = CP.get(id), f = FM.get(id);
  if (isC) {
    return `<div class="text-left">
      <div class="text-sm font-bold mb-2">${esc(cTitle(c!))}</div>
      <div class="math text-sm leading-relaxed whitespace-pre-wrap">${esc(cExpl(c!))}</div>

  if (!FCState.cur) FCState.cur = fcNextId();   // 快取當前卡，避免重渲染時換卡
  return FCState.cur;
}

const GraphState = { ch: 'all', built: false };
let graphSim: any = null;
function renderGraphView(app: HTMLElement): void {
  app.innerHTML = `
  <div class="mb-3 flex flex-wrap items-center gap-2">

      <option value="all">${t('all')}</option>

      <span class="flex items-center gap-1"><span class="w-3 h-3 inline-block" style="background:#8b5cf6"></span>${t('formula')}</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full inline-block" style="background:#94a3b8"></span>${t('question')}</span>
      <span class="flex items-center gap-1"><span class="w-4 h-3 rounded inline-block" style="background:#334155"></span>${t('chapter')}</span>
    </div>
  </div>
  <div id="graph-box" class="relative bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden" style="height:calc(100vh - 240px); height:calc(100dvh - 240px); min-height:420px;">
    <svg id="graph-svg" class="absolute inset-0 w-full h-full"></svg>
    <div id="graph-loading" class="absolute inset-0 flex items-center justify-center text-slate-400 text-sm">⏳ ${LANG==='zh' ? '載入圖譜組件中…' : 'Loading graph library…'}</div>
  </div>`;
  // 懶加載 D3：首次進入圖譜視圖時才下載（約 280KB）
  loadScript(D3_SRC).then(() => { buildGraph(); }).catch(() => {
    const box = document.getElementById('graph-loading');
    if (box) box.textContent = LANG === 'zh' ? 'D3 載入失敗，請檢查網絡後重試' : 'Failed to load D3 — check network and retry';
  });
}
function buildGraph(): void {
  const svgEl = document.getElementById('graph-svg');
  if (!svgEl) return;
  if (typeof d3 === 'undefined') return;   // D3 尚未載入完成（loadScript 完成後會再次調用）
  if (graphSim) { graphSim.stop(); graphSim = null; }
  const loadingEl = document.getElementById('graph-loading');
  if (loadingEl) loadingEl.remove();
  // ---- 構建節點與連線 ----
  const nodes: any[] = []; const links: any[] = [];
  const chapters = GraphState.ch === 'all' ? KB!.chapters : KB!.chapters.filter(c => c.chapterId === GraphState.ch);
  chapters.forEach(c => {
    nodes.push({ id: c.chapterId, type: 'chapter', label: chName(c).replace(/^第.+章\s*/, ''), r: 26 });
    (c.concepts || []).forEach(x => {
      nodes.push({ id: x.conceptId, type: 'concept', label: cTitle(x).slice(0, 14), r: 9 });
      links.push({ source: c.chapterId, target: x.conceptId });
    });
    (c.formulas || []).forEach(x => {
      nodes.push({ id: x.formulaId, type: 'formula', label: fName(x).slice(0, 14), r: 9 });
      links.push({ source: c.chapterId, target: x.formulaId });
      (x.relatedConceptIds || []).forEach(cid => { if (CP.has(cid)) links.push({ source: x.formulaId, target: cid }); });
    });
  });
  const qids = new Set<string>();
  QB!.questions.forEach(q => {
    if (GraphState.ch !== 'all' && q.chapterId !== GraphState.ch) return;
    qids.add(q.questionId);
    nodes.push({ id: q.questionId, type: 'question', label: q.questionId, r: 6 });
    (q.relatedConceptIds || []).forEach(cid => { if (CP.has(cid)) links.push({ source: q.questionId, target: cid }); });
    (q.relatedFormulaIds || []).forEach(fid => { if (FM.has(fid)) links.push({ source: q.questionId, target: fid }); });
  });
  // 去重連線 + 過濾端點缺失的連線（章節篩選時跨章關聯端點可能不在圖中）
  const nodeIds = new Set(nodes.map(n => n.id));
  const seen = new Set<string>();
  const dedupLinks = links.filter(l => {
    if (!nodeIds.has(l.source) || !nodeIds.has(l.target)) return false;
    const k = [l.source, l.target].sort().join('→');
    if (seen.has(k) || l.source === l.target) return false;
    seen.add(k); return true;
  });
  const colorOf = (d: any): string => {
    if (d.type === 'chapter') return '#334155';
    if (d.type === 'concept' || d.type === 'formula') {
      const m = MasteryStore.get(d.id);
      return m === 'mastered' ? '#10b981' : m === 'review' ? '#f59e0b' : '#f43f5e';
    }
    // 題目節點依做題記錄著色
    const log = QLogStore.all()[d.id];
    if (log) return log.c > log.w ? '#0ea5e9' : '#fb923c';
    return '#94a3b8';
  };
  const svg = d3.select(svgEl);
  svg.selectAll('*').remove();
  const box = (svgEl.parentElement as HTMLElement).getBoundingClientRect();
  const width = box.width, height = box.height;
  const g = svg.append('g');
  // 縮放 + 平移
  svg.call(d3.zoom().scaleExtent([0.15, 5]).on('zoom', (e: any) => g.attr('transform', e.transform)));
  // 連線
  const link = g.append('g').selectAll('line').data(dedupLinks).join('line')
    .attr('stroke', '#cbd5e1').attr('stroke-opacity', 0.45)
    .attr('stroke-width', 0.7);
  // 節點（chapter 用 rect，其他用 circle）
  const node = g.append('g').selectAll('g').data(nodes).join('g').attr('class', 'gnode');
  node.filter((d: any) => d.type === 'chapter').append('rect')
    .attr('width', 52).attr('height', 34).attr('x', -26).attr('y', -17).attr('rx', 8)
    .attr('fill', '#334155').attr('stroke', '#0ea5e9').attr('stroke-width', 1.5);
  node.filter((d: any) => d.type !== 'chapter').append('circle')
    .attr('r', (d: any) => d.r).attr('fill', colorOf).attr('stroke', '#ffffff').attr('stroke-width', d => d.type === 'question' ? 0.6 : 1.2).attr('stroke-opacity', 0.7);
  node.append('text')
    .text((d: any) => d.type === 'question' ? '' : d.label)
    .attr('font-size', d => d.type === 'chapter' ? 11 : 9)
    .attr('fill', d => d.type === 'chapter' ? '#f8fafc' : (THEME === 'dark' ? '#94a3b8' : '#475569'))
    .attr('text-anchor', 'middle').attr('dy', d => d.type === 'chapter' ? 4 : (d.type === 'formula' ? -13 : 14));
  node.append('title').text((d: any) => d.id + ' ' + (d.label || ''));
  // 交互：拖拽 + 點擊
  node.call(d3.drag()
    .on('start', (e: any, d: any) => { if (!e.active) graphSim.alphaTarget(0.25).restart(); d.fx = e.x; d.fy = e.y; })
    .on('drag', (e: any, d: any) => { d.fx = e.x; d.fy = e.y; })
    .on('end', (e: any, d: any) => { if (!e.active) graphSim.alphaTarget(0); d.fx = null; d.fy = null; }));
  node.on('click', (e: any, d: any) => {
    e.stopPropagation();
    if (d.type === 'concept') openModal('concept', d.id);
    else if (d.type === 'formula') openModal('formula', d.id);
    else if (d.type === 'question') openModal('question', d.id);
  });
  // 力導向模擬
  graphSim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(dedupLinks).id((d: any) => d.id).distance((d: any) => (d.source.type === 'chapter' || d.target.type === 'chapter') ? 85 : 55).strength(0.35))
    .force('charge', d3.forceManyBody().strength(-65))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collide', d3.forceCollide().radius((d: any) => d.r + 8))
    .on('tick', () => {
      link.attr('x1', (d: any) => d.source.x).attr('y1', (d: any) => d.source.y)
          .attr('x2', (d: any) => d.target.x).attr('y2', (d: any) => d.target.y);
      node.attr('transform', (d: any) => `translate(${d.x},${d.y})`);
    });
}

/* ================= 視圖5：題庫 & 隨機考試 ================= */
interface QuizCfg { chapter: string; diff: string; tag: string; count: number; minutes: number; }
const QuizState = { mode: 'practice' as 'practice'|'exam', cfg: { chapter: 'all', diff: 'all', tag: 'all', count: 10, minutes: 60 } as QuizCfg };
// 練習會話
let PRAC: { qids: string[]; idx: number; answers: Record<string, string> } | null = null;
// 模擬考試會話
let EXAM: { qids: string[]; idx: number; answers: Record<string, string>; flags: Record<string, boolean>; remain: number; timer: number; submitted: boolean } | null = null;

function allTags(): string[] {
  const s = new Set<string>();
  QB!.questions.forEach(q => (q.tags || []).forEach(x => s.add(x)));
  return [...s].sort();
}
function pickQuestions(cfg: QuizCfg, pool?: Question[]): Question[] {
  let list = (pool || QB!.questions).filter(q =>
    (cfg.chapter === 'all' || q.chapterId === cfg.chapter) &&
    (cfg.diff === 'all' || q.difficulty === cfg.diff) &&
    (cfg.tag === 'all' || (q.tags || []).includes(cfg.tag)));
  return shuffle(list).slice(0, cfg.count);
}
function renderQuizView(app: HTMLElement): void {
  const modeTab = `
  <div class="flex rounded-lg overflow-hidden border border-slate-300 dark:border-slate-700 mb-4 w-fit">
    <button data-act="quiz-mode" data-m="practice" class="px-4 py-1.5 text-sm font-medium ${QuizState.mode==='practice'?'bg-sky-600 text-white':'bg-white dark:bg-slate-900'}">🎯 ${t('practice')}</button>
    <button data-act="quiz-mode" data-m="exam" class="px-4 py-1.5 text-sm font-medium ${QuizState.mode==='exam'?'bg-sky-600 text-white':'bg-white dark:bg-slate-900'}">⏱ ${t('exam')}</button>
  </div>`;
  if (QuizState.mode === 'practice') {
    if (!PRAC) { renderPracticeConfig(app, modeTab); return; }
    renderPracticeSession(app, modeTab); return;
  }
  // 模擬考試
  if (!EXAM) { renderExamConfig(app, modeTab); return; }
  if (!EXAM.submitted) { renderExamSession(app, modeTab); return; }
  renderExamReport(app);
}

function examTick(): void {
  if (!EXAM || EXAM.submitted) return;
  EXAM.remain--;
  const el = document.getElementById('exam-timer');
  if (el) { el.textContent = '⏱ ' + fmtTime(Math.max(EXAM.remain, 0)); if (EXAM.remain < 60) el.className = 'font-mono font-bold px-3 py-1 rounded-lg bg-rose-100 text-rose-700 dark:bg-rose-900 dark:text-rose-300'; }
  if (EXAM.remain <= 0) { toast(t('exam_timeup'), 'error'); submitExam(); }
}
function submitExam(): void {
  if (!EXAM || EXAM.submitted) return;
  EXAM.submitted = true;
  clearInterval(EXAM.timer);
  // 記錄做題與錯題
  EXAM.qids.forEach(qid => {
    const q = QS.get(qid)!;
    const sel = EXAM!.answers[qid];
    const correct = sel === q.correctAnswer;
    QLogStore.record(qid, correct);
    if (!correct) WrongStore.add(qid);
  });
  renderApp();
  window.scrollTo({ top: 0 });
}
function renderExamReport(app: HTMLElement): void {

/* ================= 視圖7：掌握度統計面板 ================= */
const StatsState = { status: 'all' as 'all' | Mastery };
function renderStatsView(app: HTMLElement): void {
  const chapters = KB!.chapters;
  const mAll = MasteryStore.all();
  const qlog = QLogStore.all();
  const fcHist = FlashStore.all();
  // 知識點掌握統計
  let mMastered = 0, mReview = 0, mUn = 0;
  const perCh: { c: Chapter; mastered: number; review: number; un: number; total: number }[] = [];
  chapters.forEach(c => {
    const items = [...(c.concepts || []).map(x => x.conceptId), ...(c.formulas || []).map(x => x.formulaId)];
    let mastered = 0, review = 0, un = 0;
    items.forEach(id => { const m = mAll[id] || 'unmastered'; if (m === 'mastered') mastered++; else if (m === 'review') review++; else un++; });
    mMastered += mastered; mReview += review; mUn += un;
    perCh.push({ c, mastered, review, un, total: items.length });
  });
  const totalItems = mMastered + mReview + mUn;
  const pct = (n: number) => totalItems ? Math.round((n / totalItems) * 100) : 0;
  const totalDone = QLogStore.totalDone(), totalCorrect = QLogStore.totalCorrect();
  const acc = totalDone ? Math.round((totalCorrect / totalDone) * 100) : 0;
  const fcTotal = Object.values(fcHist).reduce((s, x) => s + x.total, 0);
  // 每章做題正確率
  const accRows = chapters.map(c => {
    const qs = QB!.questions.filter(q => q.chapterId === c.chapterId);
    let done = 0, corr = 0;
    qs.forEach(q => { const l = qlog[q.questionId]; if (l) { done += l.c + l.w; corr += l.c; } });
    return { c, done, corr, acc: done ? Math.round((corr / done) * 100) : null };
  });
  const statFilter = StatsState;
  app.innerHTML = `
  <div class="space-y-6">
    <h1 class="text-xl font-bold">📊 ${t('nav_stats')}</h1>
    <!-- 知識點掌握度 -->
    <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-5">
      <div class="font-bold mb-3">🎯 ${t('stats_kp')}</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4">
        ${[
          { l: t('kp_total'), v: totalItems, cls: 'bg-slate-600' },
          { l: t('mastered'), v: mMastered, cls: 'bg-emerald-600' },
          { l: t('review'), v: mReview, cls: 'bg-amber-500' },
          { l: t('unmastered'), v: mUn, cls: 'bg-rose-500' },
        ].map(x => `<div class="rounded-xl ${x.cls} text-white p-4"><div class="text-xs opacity-80">${x.l}</div><div class="text-2xl font-extrabold mt-1">${x.v}</div></div>`).join('')}
      </div>
      <div class="h-4 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden flex">
        <div class="h-full bg-emerald-500" style="width:${pct(mMastered)}%"></div>
        <div class="h-full bg-amber-500" style="width:${pct(mReview)}%"></div>
        <div class="h-full bg-rose-500" style="width:${pct(mUn)}%"></div>
      </div>
      <div class="mt-5 space-y-3">
        ${perCh.map(r => `
        <div>
          <div class="flex justify-between text-xs mb-1"><span class="font-medium">${esc(chName(r.c))}</span>
            <span class="text-slate-400">🟢${r.mastered} 🟡${r.review} 🔴${r.un} / ${r.total}</span></div>
          <div class="h-3 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden flex">
            <div class="h-full bg-emerald-500" style="width:${r.total ? (r.mastered / r.total) * 100 : 0}%"></div>
            <div class="h-full bg-amber-500" style="width:${r.total ? (r.review / r.total) * 100 : 0}%"></div>
            <div class="h-full bg-rose-500" style="width:${r.total ? (r.un / r.total) * 100 : 0}%"></div>
          </div>
        </div>`).join('')}
      </div>
    </section>
    <!-- 做題統計 -->
    <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-5">
      <div class="font-bold mb-3">📝 ${t('stats_q')}</div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        ${[
          { l: t('doneCount'), v: totalDone, cls: 'bg-sky-600' },
          { l: t('accuracy'), v: acc + '%', cls: acc >= 60 ? 'bg-emerald-600' : 'bg-rose-600' },
          { l: t('wrongCount'), v: WrongStore.count(), cls: 'bg-amber-600' },
          { l: t('fc_total'), v: fcTotal, cls: 'bg-violet-600' },
        ].map(x => `<div class="rounded-xl ${x.cls} text-white p-4"><div class="text-xs opacity-80">${x.l}</div><div class="text-2xl font-extrabold mt-1">${x.v}</div></div>`).join('')}
      </div>
      <div class="mt-5 space-y-3">
        ${accRows.map(r => `
        <div>
          <div class="flex justify-between text-xs mb-1"><span class="font-medium">${esc(chName(r.c))}</span>
            <span class="text-slate-400">${r.done ? `${t('doneCount')} ${r.done} · ${t('accuracy')} ${r.acc}%` : t('no_data')}</span></div>
          <div class="h-3 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
            <div class="h-full ${r.acc !== null && r.acc >= 60 ? 'bg-emerald-500' : 'bg-rose-500'}" style="width:${r.acc || 0}%"></div>
          </div>
        </div>`).join('')}
      </div>
    </section>
    <!-- 按掌握狀態過濾知識庫 -->
    <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-700 p-5">
      <div class="font-bold mb-3">🔎 ${t('filter_list')}</div>
      <div class="flex flex-wrap gap-2 mb-3 text-sm" id="stats-filter">
        ${(['all','mastered','review','unmastered'] as const).map(s =>
          `<button data-act="stats-filter" data-s="${s}" class="px-3 py-1.5 rounded-lg border ${statFilter.status===s?'bg-slate-700 dark:bg-slate-300 text-white dark:text-slate-900 font-semibold':'border-slate-300 dark:border-slate-700'}">${s==='all'?t('all'):masteryLabel(s)}</button>`).join('')}
      </div>
      <div class="grid sm:grid-cols-2 gap-2 max-h-96 overflow-y-auto">
        ${(function() {
          const out: string[] = [];
          chapters.forEach(c => {
            (c.concepts || []).forEach(x => {
              const m = mAll[x.conceptId] || 'unmastered';
              if (statFilter.status === 'all' || m === statFilter.status)
                out.push(`<button class="text-left text-sm px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 hover:ring-1 ring-sky-400" data-act="open" data-type="concept" data-id="${esc(x.conceptId)}"><span class="text-emerald-600 mr-1">●</span>${esc(cTitle(x))}</button>`);
            });
            (c.formulas || []).forEach(x => {
              const m = mAll[x.formulaId] || 'unmastered';
              if (statFilter.status === 'all' || m === statFilter.status)
                out.push(`<button class="text-left text-sm px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 hover:ring-1 ring-sky-400" data-act="open" data-type="formula" data-id="${esc(x.formulaId)}"><span class="text-violet-600 mr-1">◆</span>${esc(fName(x))}</button>`);
            });
          });
          return out.length ? out.join('') : `<div class="text-slate-400 text-sm p-4">${t('noMatch')}</div>`;
        })()}
      </div>
    </section>
  </div>`;
}

    lines.push(`**Tags:** ${(q.tags || []).join(' / ')}`);

    lines.push(`**題幹 / Question:** ${q.questionText}`);
    lines.push('');
    lines.push(`*${q.questionTextEn}*`);
    lines.push('');
    ['A','B','C','D'].forEach(k => { lines.push(`- **${k}.** ${q.options?.[k] || ''} / ${q.optionsEn?.[k] || ''}`); });
    lines.push('');
    lines.push(`**✅ 正確答案 / Correct Answer: ${q.correctAnswer}**`);
    lines.push('');
    lines.push(`**解析 / Explanation (中文):**`);
    lines.push(`> ${q.explanation.replace(/\n/g, '\n> ')}`);
    lines.push('');
    lines.push(`**Explanation (EN):**`);
    lines.push(`> ${q.explanationEn.replace(/\n/g, '\n> ')}`);
    lines.push('');
  });
  return lines.join('\n');
}
function downloadText(filename: string, text: string): void {
  const blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');

  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ================= 資料載入（fetch + 檔案選擇器 + LocalStorage 快取） ================= */
function applyData(kb: KB, qb: QB): boolean {
  if (!kb || !Array.isArray(kb.chapters) || !kb.chapters.length) { toast(t('kb_bad'), 'error'); return false; }
  if (!qb || !Array.isArray(qb.questions) || !qb.questions.length) { toast(t('qb_bad'), 'error'); return false; }
  KB = kb; QB = qb;
  lsSet(K.kb, kb); lsSet(K.qb, qb);           // 快取，供 file:// 離線使用
  rebuildIndex(); READY = true;
  fcBuildDeck();
  return true;
}
async function tryFetchData(): Promise<boolean> {
  try {
    const [kbRes, qbRes] = await Promise.all([
      fetch('./knowledge_base.json', { cache: 'no-store' }),
      fetch('./question_bank.json', { cache: 'no-store' }),
    ]);
    if (!kbRes.ok || !qbRes.ok) return false;
    const kb = await kbRes.json(); const qb = await qbRes.json();
    return applyData(kb, qb);
  } catch { return false; }   // file:// 協議下 fetch 通常被瀏覽器阻止 → 走快取/檔案選擇器
}
function loadFromCache(): boolean {
  const kb = lsGet<KB | null>(K.kb, null); const qb = lsGet<QB | null>(K.qb, null);
  if (kb && qb) return applyData(kb, qb);
  return false;
}
/** 讀取使用者選擇的 JSON 檔案（更新資料按鈕與首次設定共用） */
function pickFiles(): void {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json'; input.multiple = true;
  input.onchange = async () => {
    const files = Array.from(input.files || []);
    if (files.length < 2) { toast(t('both_needed'), 'error'); return; }
    const read = (f: File) => new Promise<string>(res => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.readAsText(f, 'utf-8'); });
    try {
      let kb: KB | null = null, qb: QB | null = null;
      for (const f of files) {
        const text = await read(f); const obj = JSON.parse(text);
        if (obj && Array.isArray(obj.chapters)) kb = obj as KB;
        else if (obj && Array.isArray(obj.questions)) qb = obj as QB;
      }
      if (!kb || !qb) { toast(t('both_needed'), 'error'); return; }
      if (applyData(kb, qb)) {
        toast(t('load_ok'));
        document.getElementById('setup-root')!.classList.add('hidden');
        closeAllModals(); renderApp();
      }
    } catch (e) { toast('JSON 解析失敗：' + (e as Error).message, 'error'); }
  };
  input.click();
}

/* ================= 全域事件委派 ================= */
document.addEventListener('click', (e: Event) => {
  const target = e.target as HTMLElement;
  const el = target.closest('[data-act]') as HTMLElement | null;
  // 彈窗遮罩關閉
  if (target.getAttribute && target.getAttribute('data-act') === 'modal-backdrop') { closeAllModals(); return; }
  if (!el) return;
  const act = el.getAttribute('data-act')!;
  const id = el.getAttribute('data-id') || '';
  switch (act) {
    case 'nav': navigate(el.getAttribute('data-v') as ViewKey); break;
    case 'lang': toggleLang(); break;
    case 'theme': toggleTheme(); break;
    case 'help': openModal('help', 'help'); break;
    case 'update-data': pickFiles(); break;
    case 'pick-files': pickFiles(); break;
    case 'retry-fetch': tryFetchData().then(ok => { if (ok) { toast(t('load_ok')); document.getElementById('setup-root')!.classList.add('hidden'); renderApp(); } else toast(t('data_load_fail'), 'error'); }); break;
    case 'modal-close': closeAllModals(); break;
    case 'modal-back': closeModal(); break;
    case 'open': openModal(el.getAttribute('data-type') as any, id); break;
    case 'mastery': MasteryStore.set(id, el.getAttribute('data-m') as Mastery); refreshMasteryGroups(id); break;
    case 'fav': {
      if (WrongStore.has(id)) { WrongStore.remove(id); toast(t('removeWrong')); }
      else { WrongStore.add(id); toast(t('favDone')); }
      renderApp(); if (modalStack.length) renderModal(); break;
    }
    case 'practice-one': {
      // 單題練習
      QuizState.mode = 'practice';
      PRAC = { qids: [id], idx: 0, answers: {} };
      navigate('quiz'); break;
    }
    // ---- 知識庫視圖 ----
    case 'kb-ch': KBState.ch = el.getAttribute('data-ch')!; renderApp(); break;
    case 'kb-sub': KBState.sub = el.getAttribute('data-sub') as any; renderApp(); break;
    case 'kb-status': KBState.status = el.getAttribute('data-s') as any; renderApp(); break;
    case 'kb-kw-clear': KBState.kw = ''; renderApp(); break;
    // ---- 閃卡 ----
    case 'fc-flip': { FCState.flipped = !FCState.flipped; renderApp(); break; }
    case 'fc-rate': {
      const r = el.getAttribute('data-r') as FCRating;
      const cur = FCState.cur;
      if (cur) {
        FlashStore.rate(cur, r);
        FCState.session[r]++;
        // 評分同步更新掌握狀態（Anki聯動）
        MasteryStore.set(cur, r === 'remember' ? 'mastered' : r === 'fuzzy' ? 'review' : 'unmastered');
        fcStateExt.lastId = cur;     // 避免下一張重複
        FCState.cur = fcNextId();    // 抽下一張
        FCState.flipped = false;
      }
      renderApp(); break;
    }
    case 'fc-next': { FCState.cur = fcNextId(); FCState.flipped = false; renderApp(); break; }
    case 'fc-skip': { fcStateExt.lastId = FCState.cur || fcStateExt.lastId; FCState.cur = fcNextId(); FCState.flipped = false; renderApp(); break; }
    case 'fc-rebuild': fcBuildDeck(); renderApp(); break;
    // ---- 圖譜 ----
    case 'graph-reset': buildGraph(); break;
    // ---- 題庫/考試 ----
    case 'quiz-mode': if (EXAM && EXAM.timer) clearInterval(EXAM.timer); QuizState.mode = el.getAttribute('data-m') as any; PRAC = null; EXAM = null; renderApp(); break;
    case 'prac-start': {
      QuizState.cfg.chapter = (document.getElementById('cfg-ch') as HTMLSelectElement).value;
      QuizState.cfg.diff = (document.getElementById('cfg-diff') as HTMLSelectElement).value;
      QuizState.cfg.tag = (document.getElementById('cfg-tag') as HTMLSelectElement).value;
      QuizState.cfg.count = Math.max(1, Math.min(160, parseInt((document.getElementById('cfg-count') as HTMLInputElement).value) || 10));
      const picked = pickQuestions(QuizState.cfg);
      if (!picked.length) { toast(t('noMatch'), 'error'); break; }
      PRAC = { qids: picked.map(q => q.questionId), idx: 0, answers: {} };
      renderApp(); break;
    }
    case 'prac-answer': {
      // 上下文感知：優先練習會話，其次錯題重做會話
      const opt = el.getAttribute('data-opt')!;
      if (PRAC) {
        const qid = PRAC.qids[PRAC.idx];
        if (PRAC.answers[qid]) break;           // 已作答不可改
        PRAC.answers[qid] = opt;
        const q = QS.get(qid)!;
        const ok = opt === q.correctAnswer;
        QLogStore.record(qid, ok);
        if (!ok) WrongStore.add(qid);
        renderApp(); break;
      }
      if (WrongState.redo) {
        const r = WrongState.redo;
        const qid = r.qids[r.idx];
        if (r.answers[qid]) break;
        r.answers[qid] = opt;
        renderApp(); break;
      }
      break;
    }
    case 'prac-next': {
      if (!PRAC) break;
      if (PRAC.idx < PRAC.qids.length - 1) { PRAC.idx++; renderApp(); }
      else { PRAC = null; renderApp(); }        // 完成返回設定
      break;
    }
    case 'prac-prev': if (PRAC && PRAC.idx > 0) { PRAC.idx--; renderApp(); } break;
    case 'prac-quit': PRAC = null; renderApp(); break;
    case 'exam-start': {
      QuizState.cfg.chapter = (document.getElementById('cfg-ch') as HTMLSelectElement).value;
      QuizState.cfg.count = Math.max(5, Math.min(160, parseInt((document.getElementById('cfg-count') as HTMLInputElement).value) || 40));
      QuizState.cfg.minutes = Math.max(5, Math.min(300, parseInt((document.getElementById('cfg-min') as HTMLInputElement).value) || 60));
      const picked = pickQuestions(QuizState.cfg);
      if (!picked.length) { toast(t('noMatch'), 'error'); break; }
      EXAM = { qids: picked.map(q => q.questionId), idx: 0, answers: {}, flags: {}, remain: QuizState.cfg.minutes * 60, timer: 0, submitted: false };
      EXAM.timer = window.setInterval(examTick, 1000);
      renderApp(); break;
    }
    case 'exam-answer': {
      if (!EXAM || EXAM.submitted) break;
      const qid = EXAM.qids[EXAM.idx];
      EXAM.answers[qid] = el.getAttribute('data-opt')!;
      renderApp(); break;
    }
    case 'exam-flag': if (EXAM) { EXAM.flags[id] = !EXAM.flags[id]; renderApp(); } break;
    case 'exam-goto': if (EXAM) { EXAM.idx = parseInt(el.getAttribute('data-i')!); renderApp(); } break;
    case 'exam-next': if (EXAM && EXAM.idx < EXAM.qids.length - 1) { EXAM.idx++; renderApp(); } break;
    case 'exam-prev': if (EXAM && EXAM.idx > 0) { EXAM.idx--; renderApp(); } break;
    case 'exam-submit': if (EXAM && confirm(t('confirm_submit'))) submitExam(); break;
    case 'exam-retake': if (EXAM && EXAM.timer) clearInterval(EXAM.timer); EXAM = null; renderApp(); break;
    case 'exam-exit': if (EXAM && EXAM.timer) clearInterval(EXAM.timer); EXAM = null; renderApp(); break;
    // ---- 錯題本 ----
    case 'wrong-redo': {
      const qids = shuffle(Object.keys(WrongStore.all()).filter(x => QS.has(x)));
      if (qids.length) WrongState.redo = { qids, idx: 0, answers: {} };
      renderApp(); break;
    }
    case 'wrong-next': {
      const r = WrongState.redo; if (!r) break;
      const qid = r.qids[r.idx];
      const sel = r.answers[qid];
      if (sel) {
        const q = QS.get(qid)!;
        const ok = sel === q.correctAnswer;
        QLogStore.record(qid, ok);
        if (ok) { WrongStore.remove(qid); toast(t('redone_ok')); }
        else { WrongStore.add(qid); toast(t('redone_stay'), 'error'); }
      }
      r.idx++; renderApp(); break;
    }
    case 'wrong-remove': WrongStore.remove(id); renderApp(); break;
    case 'wrong-exit': WrongState.redo = null; renderApp(); break;
    case 'wrong-clear': if (confirm(t('confirmClear'))) { lsSet(K.wrong, {}); renderApp(); } break;
    case 'wrong-export-md': exportWrongMD(); break;
    case 'wrong-export-pdf': exportWrongPDF(); break;
    // ---- 統計過濾 ----
    case 'stats-filter': StatsState.status = el.getAttribute('data-s') as any; renderApp(); break;
  }
});

        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];

/* ================= 視圖1：章節知識點瀏覽（含關鍵字搜尋引擎） ================= */
const KBState = { ch: 'all', sub: 'concept', status: 'all', kw: '' };
/** 關鍵字搜尋引擎：跨概念/公式/題目，中英文欄位同時比對；多關鍵字（空格分隔）為 AND 邏輯 */
function kbSearch(kw) {
    const tokens = kw.toLowerCase().split(/\s+/).filter(Boolean);
    const out = { concepts: [], formulas: [], questions: [] };
    if (!tokens.length)
        return out;
    const inText = (hay) => {
        const t = hay.toLowerCase();
        return tokens.every(tok => t.indexOf(tok) >= 0);
    };
    // 章節範圍：選了特定章節則在該章內搜尋，否則全庫搜尋
    const chOk = (chId) => KBState.ch === 'all' || KBState.ch === chId;
    // 生成摘要：定位第一個命中位置，前後取文
    const snippet = (text) => {
        const lower = text.toLowerCase();
        let idx = -1, hitLen = 0;
        tokens.forEach(tok => {
            const i = lower.indexOf(tok);
            if (i >= 0 && (idx < 0 || i < idx)) {
                idx = i;
                hitLen = tok.length;
            }
        });
        if (idx < 0)
            idx = 0;
        const start = Math.max(0, idx - 40);
        const end = Math.min(text.length, idx + hitLen + 110);
        return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
    };
    KB.chapters.forEach(c => {
        (c.concepts || []).forEach(x => {
            if (!chOk(c.chapterId))
                return;
            const hay = [x.conceptId, x.title, x.titleEn, x.explanation, x.explanationEn, (x.tags || []).join(' '), (x.tagsEn || []).join(' ')].join('\n');
            if (inText(hay))
                out.concepts.push({ type: 'concept', id: x.conceptId, chId: c.chapterId, title: cTitle(x), snippet: snippet(x.explanation || x.title) });
        });
        (c.formulas || []).forEach(x => {
            if (!chOk(c.chapterId))
                return;
            const hay = [x.formulaId, x.name, x.nameEn, x.latex, x.description, x.descriptionEn].join('\n');
            if (inText(hay))
                out.formulas.push({ type: 'formula', id: x.formulaId, chId: c.chapterId, title: fName(x), snippet: snippet(x.description || x.name) });
        });
    });
    QB.questions.forEach(q => {
        if (!chOk(q.chapterId))
            return;
        const hay = [q.questionId, q.questionText, q.questionTextEn, (q.tags || []).join(' ')].join('\n');
        if (inText(hay))
            out.questions.push({ type: 'question', id: q.questionId, chId: q.chapterId, title: qText(q), snippet: snippet(qText(q)) });
    });
    return out;
}
/** 在已 HTML 轉義的文本上高亮關鍵字（mark 標記） */
function hlMark(text, kw) {
    const escd = esc(text);
    const tokens = kw.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!tokens.length)
        return escd;
    let outText = escd;
    tokens.forEach(tok => {
        // 轉義正則特殊字符，避免關鍵字含符號時崩潰
        const safe = tok.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        outText = outText.replace(new RegExp(safe, 'gi'), m => '<mark class="bg-amber-200 dark:bg-amber-600/50 rounded px-0.5">' + m + '</mark>');
    });
    return outText;
}

/** 簡易Anki優先抽卡：忘記 > 未掌握 > 待複習 > 已掌握，另疊加歷史評分與隨機性 */
function fcWeight(card) {
    const m = MasteryStore.get(card.id);
    const h = FlashStore.all()[card.id];
    let w = m === 'unmastered' ? 40 : m === 'review' ? 25 : 8;
    if (h) {
        if (h.lastRating === 'forgot')
            w += 30;
        else if (h.lastRating === 'fuzzy')
            w += 15;
        else
            w -= 5; // 記住 → 降低權重
        w += Math.min(h.forgot * 4, 12); // 歷史忘記次數加權
    }
    if (FCState.scope === 'weak' && m === 'mastered' && (!h || h.lastRating !== 'forgot'))

    if (FCState.scope === 'weak')
        cards = cards.filter(x => MasteryStore.get(x.id) !== 'mastered' || FlashStore.all()[x.id]?.lastRating === 'forgot');
    FCState.deck = cards;

function fcNextId() {

    const use = pool.length ? pool : FCState.deck;
    if (!use.length)
        return null;
    const weights = use.map(x => fcWeight(x));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < use.length; i++) {

    node.filter((d) => d.type !== 'chapter').append('circle')

            openModal('formula', d.id);

        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collide', d3.forceCollide().radius((d) => d.r + 8))
        .on('tick', () => {
        link.attr('x1', (d) => d.source.x).attr('y1', (d) => d.source.y)
            .attr('x2', (d) => d.target.x).attr('y2', (d) => d.target.y);
        node.attr('transform', (d) => `translate(${d.x},${d.y})`);
    });

/* ================= 資料載入（fetch + 檔案選擇器 + LocalStorage 快取） ================= */
function applyData(kb, qb) {
    if (!kb || !Array.isArray(kb.chapters) || !kb.chapters.length) {
        toast(t('kb_bad'), 'error');
        return false;
    }
    if (!qb || !Array.isArray(qb.questions) || !qb.questions.length) {
        toast(t('qb_bad'), 'error');
        return false;
    }
    KB = kb;
    QB = qb;
    lsSet(K.kb, kb);
    lsSet(K.qb, qb); // 快取，供 file:// 離線使用
    rebuildIndex();
    READY = true;
    fcBuildDeck();
    return true;
}
async function tryFetchData() {
    try {
        const [kbRes, qbRes] = await Promise.all([
            fetch('./knowledge_base.json', { cache: 'no-store' }),
            fetch('./question_bank.json', { cache: 'no-store' }),
        ]);
        if (!kbRes.ok || !qbRes.ok)
            return false;
        const kb = await kbRes.json();
        const qb = await qbRes.json();
        return applyData(kb, qb);
    }
    catch {
        return false;
    } // file:// 協議下 fetch 通常被瀏覽器阻止 → 走快取/檔案選擇器
}
function loadFromCache() {
    const kb = lsGet(K.kb, null);
    const qb = lsGet(K.qb, null);
    if (kb && qb)
        return applyData(kb, qb);
    return false;
}
/** 讀取使用者選擇的 JSON 檔案（更新資料按鈕與首次設定共用） */
function pickFiles() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.multiple = true;
    input.onchange = async () => {
        const files = Array.from(input.files || []);
        if (files.length < 2) {
            toast(t('both_needed'), 'error');
            return;
        }
        const read = (f) => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.readAsText(f, 'utf-8'); });
        try {
            let kb = null, qb = null;
            for (const f of files) {
                const text = await read(f);
                const obj = JSON.parse(text);
                if (obj && Array.isArray(obj.chapters))
                    kb = obj;
                else if (obj && Array.isArray(obj.questions))
                    qb = obj;
            }
            if (!kb || !qb) {
                toast(t('both_needed'), 'error');
                return;
            }
            if (applyData(kb, qb)) {
                toast(t('load_ok'));
                document.getElementById('setup-root').classList.add('hidden');
                closeAllModals();
                renderApp();
            }
        }
        catch (e) {
            toast('JSON 解析失敗：' + e.message, 'error');
        }
    };
    input.click();
}

/* ================= 全域事件委派 ================= */
document.addEventListener('click', (e) => {
    const target = e.target;
    const el = target.closest('[data-act]');
    // 彈窗遮罩關閉
    if (target.getAttribute && target.getAttribute('data-act') === 'modal-backdrop') {
        closeAllModals();
        return;
    }
    if (!el)
        return;
    const act = el.getAttribute('data-act');
    const id = el.getAttribute('data-id') || '';
    switch (act) {
        case 'nav':
            navigate(el.getAttribute('data-v'));
            break;
        case 'lang':
            toggleLang();
            break;
        case 'theme':
            toggleTheme();
            break;
        case 'help':
            openModal('help', 'help');
            break;
        case 'update-data':
            pickFiles();
            break;
        case 'pick-files':
            pickFiles();
            break;
        case 'retry-fetch':
            tryFetchData().then(ok => { if (ok) {
                toast(t('load_ok'));
                document.getElementById('setup-root').classList.add('hidden');
                renderApp();
            }
            else
                toast(t('data_load_fail'), 'error'); });
            break;
        case 'modal-close':
            closeAllModals();
            break;
        case 'modal-back':
            closeModal();
            break;
        case 'open':
            openModal(el.getAttribute('data-type'), id);
            break;
        case 'mastery':
            MasteryStore.set(id, el.getAttribute('data-m'));
            refreshMasteryGroups(id);
            break;
        case 'fav': {
            if (WrongStore.has(id)) {
                WrongStore.remove(id);
                toast(t('removeWrong'));
            }
            else {
                WrongStore.add(id);
                toast(t('favDone'));
            }
            renderApp();
            if (modalStack.length)
                renderModal();
            break;
        }
        case 'practice-one': {
            // 單題練習
            QuizState.mode = 'practice';
            PRAC = { qids: [id], idx: 0, answers: {} };
            navigate('quiz');
            break;
        }
        // ---- 知識庫視圖 ----
        case 'kb-ch':
            KBState.ch = el.getAttribute('data-ch');
            renderApp();
            break;
        case 'kb-sub':
            KBState.sub = el.getAttribute('data-sub');
            renderApp();
            break;
        case 'kb-status':
            KBState.status = el.getAttribute('data-s');
            renderApp();
            break;
        case 'kb-kw-clear':
            KBState.kw = '';
            renderApp();
            break;
        // ---- 閃卡 ----
        case 'fc-flip': {
            FCState.flipped = !FCState.flipped;
            renderApp();
            break;
        }
        case 'fc-rate': {
            const r = el.getAttribute('data-r');
            const cur = FCState.cur;
            if (cur) {
                FlashStore.rate(cur, r);
                FCState.session[r]++;
                // 評分同步更新掌握狀態（Anki聯動）
                MasteryStore.set(cur, r === 'remember' ? 'mastered' : r === 'fuzzy' ? 'review' : 'unmastered');
                fcStateExt.lastId = cur; // 避免下一張重複
                FCState.cur = fcNextId(); // 抽下一張
                FCState.flipped = false;
            }
            renderApp();
            break;
        }
        case 'fc-next': {
            FCState.cur = fcNextId();
            FCState.flipped = false;
            renderApp();
            break;
        }
        case 'fc-skip': {
            fcStateExt.lastId = FCState.cur || fcStateExt.lastId;
            FCState.cur = fcNextId();
            FCState.flipped = false;
            renderApp();
            break;
        }
        case 'fc-rebuild':
            fcBuildDeck();
            renderApp();
            break;
        // ---- 圖譜 ----
        case 'graph-reset':
            buildGraph();
            break;
        // ---- 題庫/考試 ----
        case 'quiz-mode':
            if (EXAM && EXAM.timer)
                clearInterval(EXAM.timer);
            QuizState.mode = el.getAttribute('data-m');
            PRAC = null;
            EXAM = null;
            renderApp();
            break;
        case 'prac-start': {
            QuizState.cfg.chapter = document.getElementById('cfg-ch').value;
            QuizState.cfg.diff = document.getElementById('cfg-diff').value;
            QuizState.cfg.tag = document.getElementById('cfg-tag').value;
            QuizState.cfg.count = Math.max(1, Math.min(160, parseInt(document.getElementById('cfg-count').value) || 10));
            const picked = pickQuestions(QuizState.cfg);
            if (!picked.length) {
                toast(t('noMatch'), 'error');
                break;
            }
            PRAC = { qids: picked.map(q => q.questionId), idx: 0, answers: {} };
            renderApp();
            break;
        }
        case 'prac-answer': {
            // 上下文感知：優先練習會話，其次錯題重做會話
            const opt = el.getAttribute('data-opt');
            if (PRAC) {
                const qid = PRAC.qids[PRAC.idx];
                if (PRAC.answers[qid])
                    break; // 已作答不可改
                PRAC.answers[qid] = opt;
                const q = QS.get(qid);
                const ok = opt === q.correctAnswer;
                QLogStore.record(qid, ok);
                if (!ok)
                    WrongStore.add(qid);
                renderApp();
                break;
            }
            if (WrongState.redo) {
                const r = WrongState.redo;
                const qid = r.qids[r.idx];
                if (r.answers[qid])
                    break;
                r.answers[qid] = opt;
                renderApp();
                break;
            }
            break;
        }
        case 'prac-next': {
            if (!PRAC)
                break;
            if (PRAC.idx < PRAC.qids.length - 1) {
                PRAC.idx++;
                renderApp();
            }
            else {
                PRAC = null;
                renderApp();
            } // 完成返回設定
            break;
        }
        case 'prac-prev':
            if (PRAC && PRAC.idx > 0) {
                PRAC.idx--;
                renderApp();
            }
            break;
        case 'prac-quit':
            PRAC = null;
            renderApp();
            break;
        case 'exam-start': {
            QuizState.cfg.chapter = document.getElementById('cfg-ch').value;
            QuizState.cfg.count = Math.max(5, Math.min(160, parseInt(document.getElementById('cfg-count').value) || 40));
            QuizState.cfg.minutes = Math.max(5, Math.min(300, parseInt(document.getElementById('cfg-min').value) || 60));
            const picked = pickQuestions(QuizState.cfg);
            if (!picked.length) {
                toast(t('noMatch'), 'error');
                break;
            }
            EXAM = { qids: picked.map(q => q.questionId), idx: 0, answers: {}, flags: {}, remain: QuizState.cfg.minutes * 60, timer: 0, submitted: false };
            EXAM.timer = window.setInterval(examTick, 1000);
            renderApp();
            break;
        }
        case 'exam-answer': {
            if (!EXAM || EXAM.submitted)
                break;
            const qid = EXAM.qids[EXAM.idx];
            EXAM.answers[qid] = el.getAttribute('data-opt');
            renderApp();
            break;
        }
        case 'exam-flag':
            if (EXAM) {
                EXAM.flags[id] = !EXAM.flags[id];
                renderApp();
            }
            break;
        case 'exam-goto':
            if (EXAM) {
                EXAM.idx = parseInt(el.getAttribute('data-i'));
                renderApp();
            }
            break;
        case 'exam-next':
            if (EXAM && EXAM.idx < EXAM.qids.length - 1) {
                EXAM.idx++;
                renderApp();
            }
            break;
        case 'exam-prev':
            if (EXAM && EXAM.idx > 0) {
                EXAM.idx--;
                renderApp();
            }
            break;
        case 'exam-submit':
            if (EXAM && confirm(t('confirm_submit')))
                submitExam();
            break;
        case 'exam-retake':
            if (EXAM && EXAM.timer)
                clearInterval(EXAM.timer);
            EXAM = null;
            renderApp();
            break;
        case 'exam-exit':
            if (EXAM && EXAM.timer)
                clearInterval(EXAM.timer);
            EXAM = null;
            renderApp();
            break;
        // ---- 錯題本 ----
        case 'wrong-redo': {
            const qids = shuffle(Object.keys(WrongStore.all()).filter(x => QS.has(x)));
            if (qids.length)
                WrongState.redo = { qids, idx: 0, answers: {} };
            renderApp();
            break;
        }
        case 'wrong-next': {
            const r = WrongState.redo;
            if (!r)
                break;
            const qid = r.qids[r.idx];
            const sel = r.answers[qid];
            if (sel) {
                const q = QS.get(qid);
                const ok = sel === q.correctAnswer;
                QLogStore.record(qid, ok);
                if (ok) {
                    WrongStore.remove(qid);
                    toast(t('redone_ok'));
                }
                else {
                    WrongStore.add(qid);
                    toast(t('redone_stay'), 'error');
                }
            }
            r.idx++;
            renderApp();
            break;
        }
        case 'wrong-remove':
            WrongStore.remove(id);
            renderApp();
            break;
        case 'wrong-exit':
            WrongState.redo = null;
            renderApp();
            break;
        case 'wrong-clear':
            if (confirm(t('confirmClear'))) {
                lsSet(K.wrong, {});
                renderApp();
            }
            break;
        case 'wrong-export-md':
            exportWrongMD();
            break;
        case 'wrong-export-pdf':
            exportWrongPDF();
            break;
        // ---- 統計過濾 ----
        case 'stats-filter':
            StatsState.status = el.getAttribute('data-s');
            renderApp();
            break;
    }
});
// 下拉/輸入變更事件委派
document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.id === 'kb-ch-select') {
        KBState.ch = el.value;
        renderApp();
    }
    else if (el.id === 'fm-ch') {
        FMState.ch = el.value;
        renderApp();
    }
    else if (el.id === 'fm-status') {
        FMState.status = el.value;
        renderApp();
    }
    else if (el.id === 'fc-ch') {
        FCState.ch = el.value;
        fcBuildDeck();
        renderApp();
    }
    else if (el.id === 'fc-scope') {
        FCState.scope = el.value;
        fcBuildDeck();
        renderApp();
    }
    else if (el.id === 'fc-type') {
        FCState.type = el.value;
        fcBuildDeck();
        renderApp();
    }
    else if (el.id === 'graph-ch') {
        GraphState.ch = el.value;
        renderApp();
    }
    else if (el.id === 'fm-kw') { /* 由 input 事件處理 */ }
});
/** 重渲染後恢復搜尋框焦點與光標位置 */
function restoreCaret(id) {
    setTimeout(() => {
        const inp = document.getElementById(id);
        if (inp) {
            inp.focus();
            const n2 = inp.value.length;
            try {
                inp.setSelectionRange(n2, n2);
            }
            catch (e) { }
        }
    }, 0);
}
document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.id === 'kb-kw') {
        KBState.kw = el.value;
        clearTimeout(window.__kbTimer);
        window.__kbTimer = setTimeout(() => { renderApp(); restoreCaret('kb-kw'); }, 220);
    }
    else if (el.id === 'fm-kw') {
        FMState.kw = el.value;
        clearTimeout(window.__fmTimer);
        window.__fmTimer = setTimeout(() => { renderApp(); restoreCaret('fm-kw'); }, 250);
    }
});
/** 掌握狀態按鈕按下後，局部刷新該組按鈕（不整頁重繪，保留滾動位置） */
function refreshMasteryGroups(id) {
    document.querySelectorAll(`[data-mastery-group="${id}"]`).forEach(g => {
        const tmp = document.createElement('div');
        tmp.innerHTML = masteryButtons(id);
        g.replaceWith(tmp.firstElementChild);
    });
}
/* ================= 啟動流程 ================= */
async function boot() {
    applyTheme();
    renderTopnav();
    ACTIVE = currentHash();
    // 1) 嘗試 fetch 同目錄 JSON（需 http/https 伺服器）
    const ok = await tryFetchData();
    // 2) 失敗則讀 LocalStorage 快取
    if (!ok) {
        if (!loadFromCache())
            showSetup();
    }
    renderApp();
    const sp = document.getElementById('splash');
    if (sp)
        sp.remove(); // 移除啟動遮罩
}
boot();
